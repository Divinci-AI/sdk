# Divinci Docs — rebuild + redeploy the docs site on content changes.
#
# Knowledge re-ingest is intentionally NOT done here. Direct `docs sync` /
# `rag crawl` into a published Release vector is a silent no-op
# (isVectorUsed → failedChunkSources "Can't update vector when used").
# Keep the assistant current with a web_crawl connector + --swap --recurring
# (see the generated README's "Keeping in sync" section). This workflow only
# ships the static site.
name: divinci-docs-sync

on:
  push:
    branches: [__DIVINCI_DEFAULT_BRANCH__]
    paths:
      - "src/content/docs/**"
      - "__DIVINCI_SOURCE_GLOB__"
  workflow_dispatch:

concurrency:
  group: divinci-docs-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Optional: report which docs changed (never re-ingests — see header).
      - name: Report changed docs
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          SINCE_REF: ${{ github.event.before }}
          SITE_URL: ${{ vars.DIVINCI_SITE_URL }}
        run: >
          npx --yes @divinci-ai/cli docs sync
          --since "$SINCE_REF"
          --base-url "$SITE_URL"
          || true

      - name: Build + deploy
        env:
          PUBLIC_DIVINCI_RELEASE_ID: ${{ vars.DIVINCI_RELEASE_ID }}
          PUBLIC_DIVINCI_API_URL: ${{ vars.DIVINCI_API_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm build
          pnpm dlx wrangler deploy --env=""
